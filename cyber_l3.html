

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile PPTX Quiz</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 10px; 
            margin: 0;
            background: #f0f2f5; 
            color: #1c1e21;
        }

        #quiz-container, #final-screen { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 500px; /* Limits width on desktop, but 100% on mobile */
            margin-top: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        }

        h3 { font-size: 1.2rem; line-height: 1.4; margin-top: 0; }

        .hidden { display: none !important; }

        /* Image Styling */
        .img-wrapper {
            width: 100%;
            text-align: center;
            margin: 15px 0;
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            border: 1px solid #ddd;
        }

        /* Option Buttons - Large for Thumb Tapping */
        .option-btn { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 15px; /* Larger padding for mobile */
            text-align: left; 
            cursor: pointer; 
            border: 2px solid #e4e6eb; 
            border-radius: 8px; 
            background: #f7f8fa;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .option-btn:active { transform: scale(0.98); }

        .selected { background-color: #e7f3ff; border-color: #1877f2; }
        
        .correct { 
            background-color: #e7f3ef !important; 
            border-color: #28a745 !important; 
            color: #155724;
            font-weight: bold;
        }

        /* Control Buttons */
        .controls { 
            margin-top: 25px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        button:not(.option-btn) {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        #submit-btn { background: #1877f2; color: white; }
        #submit-btn:disabled { background: #ccd0d5; color: #8a8d91; }

        #next-btn { background: #42b72a; color: white; }
        #next-btn:disabled { background: #ccd0d5; color: #8a8d91; }

        /* Ticker & Explanation */
        #ticker { 
            margin-top: 25px; 
            font-size: 0.9rem; 
            text-align: center;
            color: #65676b;
            border-top: 1px solid #ebedf0; 
            padding-top: 15px; 
        }

        #explanation { 
            margin-top: 15px; 
            padding: 12px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            border-left: 4px solid #ffc107;
        }

        #final-screen { text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="question-box">
        <h3 id="q-text"></h3>
        <img id="q-img" src="" class="hidden">
        <div id="options-container"></div>
    </div>
    
    <div class="controls">
        <button id="submit-btn" disabled>Submit</button>
        <button id="next-btn" disabled>Next</button>
    </div>

    <div id="ticker"></div>
    <div id="explanation" class="hidden"></div>
</div>

<div id="final-screen" class="hidden" style="text-align:center;">
    <h1>Quiz Complete!</h1>
    <h2 id="final-score"></h2>
    <p>Thank you for participating.</p>
</div>

<script>
    const quizData = [
  {
    "id": "s3q1",
    "question": "Which asset class is rated with 'Critical' impact across Confidentiality, Integrity, and Availability?",
    "options": ["Commercial Comms", "Ground Control (MCC)", "User Terminals", "Space Nuclear Systems"],
    "correct": 1,
    "explanation": "Ground Control (Mission Control Centers) is identified as a critical asset where any compromise to its confidentiality, integrity, or availability results in critical mission impact[cite: 2445, 2446, 2447, 2448, 2449]."
  },
  {
    "id": "s4q1",
    "question": "Why is traditional Endpoint Detection and Response (EDR) difficult to implement on satellites?",
    "options": ["Satellites do not use operating systems", "Resource constraints and use of specialized RTOS like VxWorks", "Standard TLS handshakes are too fast for space", "Firewalls at ground stations block EDR agents"],
    "correct": 1,
    "explanation": "Satellites run Real-Time Operating Systems (RTOS) on custom hardware where resource constraints prevent the use of heavy traditional security agents[cite: 2501]."
  },
  {
    "id": "s4q2",
    "question": "What is the primary risk associated with patching satellite software?",
    "options": ["It is too expensive", "Over-the-Air (OTA) updates are risky and can 'brick' the satellite", "Radiation prevents code from being uploaded", "Standard IP protocols make patches too large"],
    "correct": 1,
    "explanation": "Patching is performed Over-the-Air; a failed patch operation can lead to a 'dead' or bricked satellite that is unrecoverable due to lack of physical access[cite: 2502, 2597]."
  },
  {
    "id": "s5q1",
    "question": "In the Purdue Model for OT, what is considered the 'Last Line of Defense' that triggers emergency shutdowns?",
    "options": ["Industrial DMZ", "Supervisory Control (SCADA Master)", "Safety Instrumented Systems (SIS)", "Enterprise Network"],
    "correct": 2,
    "explanation": "Safety Instrumented Systems (SIS) act as the independent last line of defense, monitoring for hazardous conditions to trigger an emergency shutdown[cite: 2542, 2543]."
  },
  {
    "id": "s7q1",
    "question": "How does the vacuum of space impact continuous security monitoring?",
    "options": ["It increases CPU speed", "Heat dissipation is difficult, so high CPU load risks overheating", "Vacuum prevents encryption algorithms from running", "Encryption requires liquid cooling not available in space"],
    "correct": 1,
    "explanation": "Because heat dissipation in a vacuum is difficult, continuous high CPU utilization for complex security monitoring or encryption poses a high overheating risk[cite: 2586, 2587]."
  },
  {
    "id": "s8q1",
    "question": "What is a major challenge for multi-factor authentication (MFA) in Geostationary Earth Orbit (GEO)?",
    "options": ["Lack of internet in GEO", "Push notifications may time out due to 600ms+ round trip latency", "Radiation destroys the MFA tokens", "GEO satellites do not support push protocols"],
    "correct": 1,
    "explanation": "The high latency (600ms+ RTT) in GEO can cause standard authentication windows or MFA push notifications to time out before user approval reaches the satellite[cite: 2612, 2617]."
  },
  {
    "id": "s10q1",
    "question": "What is a 'Single Event Upset' (SEU) in the context of space radiation?",
    "options": ["A permanent hardware short circuit", "A non-destructive 'Bit Flip' caused by a high-energy ion strike", "Gradual silicon degradation over many years", "Total loss of solar panel power"],
    "correct": 1,
    "explanation": "An SEU is a non-destructive 'soft error' where a single high-energy ion strikes a memory cell, changing a 0 to a 1 or vice-versa[cite: 2688, 2689, 2690]."
  },
  {
    "id": "s11q1",
    "question": "Which security priority model is typically applied to the Space Domain?",
    "options": ["C-I-A (Confidentiality First)", "A-I-C (Availability First)", "S-A-I-C (Mission Success/Survival First)", "I-A-C (Integrity First)"],
    "correct": 2,
    "explanation": "The Space Domain uses the S-A-I-C model, prioritizing the survival of the asset and the control link as a prerequisite for mission success[cite: 2728, 2729, 2730]."
  },
  {
    "id": "s12q1",
    "question": "Which real-world incident involved 'AcidRain' malware bricking thousands of satellite modems?",
    "options": ["Starlink Jamming (2022)", "Viasat KA-SAT (2022)", "Black Sea GPS Spoofing", "Iridium 33 Collision"],
    "correct": 1,
    "explanation": "The Viasat KA-SAT attack in February 2022 utilized 'AcidRain' wiper malware to brick modems via the management network[cite: 2798, 2799, 2901, 2902]."
  },
  {
    "id": "s15q1",
    "question": "Under the STRIDE methodology, 'RF Jamming' is classified as which type of threat?",
    "options": ["Spoofing", "Tampering", "Denial of Service", "Information Disclosure"],
    "correct": 2,
    "explanation": "RF Jamming is categorized as a Denial of Service (DoS) threat because it aims to deny valid users access to the service[cite: 2905, 2907]."
  },
  {
    "id": "s18q1",
    "question": "What is a major emerging security risk posed by inter-satellite laser links (ISL)?",
    "options": ["They are too slow for encryption", "Malware could propagate orbitally between satellites without ground touchpoints", "Laser links cannot be monitored by ground stations", "They require too much power to be secure"],
    "correct": 1,
    "explanation": "ISLs create space-based mesh networks where malware can potentially propagate laterally through orbital 'mesh' network exploits[cite: 2943, 2944, 2945]."
  }
]
    
    let currentIdx = 0;
    let correctCount = 0;
    let answeredCount = 0;

    const qText = document.getElementById('q-text');
    const qImg = document.getElementById('q-img');
    const optionsContainer = document.getElementById('options-container');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const ticker = document.getElementById('ticker');
    const explanation = document.getElementById('explanation');

    function loadQuestion() {
        const q = quizData[currentIdx];
        qText.innerText = q.question;
        
        if(q.image) {
            qImg.src = q.image;
            qImg.classList.remove('hidden');
        } else {
            qImg.classList.add('hidden');
        }

        optionsContainer.innerHTML = '';
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(i);
            optionsContainer.appendChild(btn);
        });

        explanation.classList.add('hidden');
        submitBtn.disabled = true;
        nextBtn.disabled = true;
        updateTicker();
    }

    let selectedIdx = null;
    function selectOption(idx) {
        if (nextBtn.disabled === false) return; // Lock after submit
        selectedIdx = idx;
        submitBtn.disabled = false;
        
        // Visual feedback for selection
        Array.from(optionsContainer.children).forEach((btn, i) => {
            btn.style.background = (i === idx) ? '#e9ecef' : 'white';
        });
    }

    submitBtn.onclick = () => {
        const q = quizData[currentIdx];
        const buttons = optionsContainer.children;
        
        // Requirement 5: Highlight correct in green
        buttons[q.correct].classList.add('correct');
        
        if (selectedIdx === q.correct) {
            correctCount++;
        }
        
        answeredCount++;
        explanation.innerText = "Explanation: " + q.explanation;
        explanation.classList.remove('hidden');
        
        submitBtn.disabled = true;
        nextBtn.disabled = false;
        
        if (currentIdx === quizData.length - 1) {
            nextBtn.innerText = "Done";
        }
        updateTicker();
    };

    nextBtn.onclick = () => {
        if (currentIdx < quizData.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            showFinal();
        }
    };

    function updateTicker() {
        ticker.innerText = `Correct: ${correctCount} / Answered: ${answeredCount} / Total: ${quizData.length}`;
    }

    function showFinal() {
        document.getElementById('quiz-container').classList.add('hidden');
        const final = document.getElementById('final-screen');
        final.classList.remove('hidden');
        document.getElementById('final-score').innerText = `Your Score: ${correctCount} / ${quizData.length}`;
    }

    loadQuestion();
</script>
</body>
</html>
