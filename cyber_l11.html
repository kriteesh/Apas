

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile PPTX Quiz</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 10px; 
            margin: 0;
            background: #f0f2f5; 
            color: #1c1e21;
        }

        #quiz-container, #final-screen { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 500px; /* Limits width on desktop, but 100% on mobile */
            margin-top: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        }

        h3 { font-size: 1.2rem; line-height: 1.4; margin-top: 0; }

        .hidden { display: none !important; }

        /* Image Styling */
        .img-wrapper {
            width: 100%;
            text-align: center;
            margin: 15px 0;
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            border: 1px solid #ddd;
        }

        /* Option Buttons - Large for Thumb Tapping */
        .option-btn { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 15px; /* Larger padding for mobile */
            text-align: left; 
            cursor: pointer; 
            border: 2px solid #e4e6eb; 
            border-radius: 8px; 
            background: #f7f8fa;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .option-btn:active { transform: scale(0.98); }

        .selected { background-color: #e7f3ff; border-color: #1877f2; }
        
        .correct { 
            background-color: #e7f3ef !important; 
            border-color: #28a745 !important; 
            color: #155724;
            font-weight: bold;
        }

        /* Control Buttons */
        .controls { 
            margin-top: 25px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        button:not(.option-btn) {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        #submit-btn { background: #1877f2; color: white; }
        #submit-btn:disabled { background: #ccd0d5; color: #8a8d91; }

        #next-btn { background: #42b72a; color: white; }
        #next-btn:disabled { background: #ccd0d5; color: #8a8d91; }

        /* Ticker & Explanation */
        #ticker { 
            margin-top: 25px; 
            font-size: 0.9rem; 
            text-align: center;
            color: #65676b;
            border-top: 1px solid #ebedf0; 
            padding-top: 15px; 
        }

        #explanation { 
            margin-top: 15px; 
            padding: 12px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            border-left: 4px solid #ffc107;
        }

        #final-screen { text-align: center; padding: 40px 20px; }
    </style>
</head>

    <div class="controls">

</div>

<div id="final-screen" class="hidden" style="text-align:center;">

</div>

<script>
    const quizData = [{"question": "What is the primary objective of Linux Hardening?", "options": ["To increase the attack surface of the system", "To prevent unauthorized access and reduce the attack surface", "To make the system more vulnerable to cyberattacks", "To completely eliminate all security layers"], "correct": 1, "explanation": "Linux Hardening aims to secure a system by reducing the attack surface and preventing unauthorized access, among other objectives.", "image": "slide_images\\l11\\slide_1.png"}, {"question": "Which of the following is a key principle of Linux Hardening?", "options": ["Security is a single layer of protection", "Security relies on multiple layers of defense", "Security measures should be applied only to the network", "Security is solely focused on preventing unauthorized access"], "correct": 1, "explanation": "The slide emphasizes that security is about layers, meaning that if one layer fails, the next one takes over, providing multiple levels of defense.", "image": "slide_images\\l11\\slide_1.png"}, {"question": "What are the primary risks associated with the default state of a system according to the slide content?", "options": ["Ransomware & Exfiltration", "Lateral Movement via weak credentials", "Unnecessary Ports, Default installations, Root Login Enabled, and Weak Permissions", "System compromise & Breach"], "correct": 2, "explanation": "Stage 1: Default State lists 'Unnecessary Ports', 'Default installations may run background services', 'Root Login Enabled', and 'Weak Permissions' as inherent risks.", "image": "slide_images\\l11\\slide_3.png"}, {"question": "What is the consequence of the risks outlined in Stage 2: The Risks?", "options": ["FTP/Telnet open ports provide entry", "Ransomware & Exfiltration", "Lateral Movement via weak credentials", "System compromise & Breach"], "correct": 3, "explanation": "Stage 3: Consequences explicitly states 'System compromise & Breach' as the outcome of the risks described in Stage 2.", "image": "slide_images\\l11\\slide_3.png"}, {"question": "Which of the following is NOT a key Linux hardening measure mentioned in the slide?", "options": ["Disabling unused network services", "Implementing the principle of least privilege (PoLP)", "Using a graphical user interface (GUI) for system administration", "Configuring a firewall"], "correct": 2, "explanation": "The slide emphasizes minimizing attack surfaces by disabling unnecessary services and implementing security measures like PoLP and firewalls. A GUI is not mentioned and is not a standard hardening measure.", "image": "slide_images\\l11\\slide_4.png"}, {"question": "What is the primary goal of implementing file system security and file/directory permissions in Linux hardening?", "options": ["To increase the system's processing speed", "To prevent unauthorized access to sensitive data", "To simplify the user interface", "To reduce the number of available network ports"], "correct": 1, "explanation": "File system security and proper file/directory permissions are implemented to control access and prevent unauthorized users from viewing or modifying sensitive information, thus protecting data integrity and confidentiality.", "image": "slide_images\\l11\\slide_4.png"}, {"question": "What is the primary goal of the Principle of Least Privilege (PoLP) in Linux hardening?", "options": ["To ensure all users have root access for efficiency", "To grant only the minimum necessary access to users, processes, or programs", "To disable all unnecessary services to reduce attack surface", "To remove all unused software and libraries"], "correct": 1, "explanation": "PoLP aims to limit access rights to the minimum levels necessary for users, processes, or programs to perform their tasks, reducing the risk of privilege escalation and potential security breaches.", "image": "slide_images\\l11\\slide_5.png"}, {"question": "Which of the following is a recommended measure to minimize the attack surface in Linux hardening?", "options": ["Running all applications as root for better performance", "Disabling unnecessary services to reduce potential attack vectors", "Installing all available software to ensure functionality", "Using sudo to provide unlimited administrative privileges"], "correct": 1, "explanation": "Disabling unnecessary services reduces the number of potential entry points for attackers, thereby minimizing the attack surface and making the system more secure.", "image": "slide_images\\l11\\slide_5.png"}, {"question": "Which of the following is a recommended practice for keeping a Linux system updated and secure?", "options": ["Manually updating the OS and kernel only when necessary", "Using package managers like apt or yum to automate updates and patches", "Disabling all automatic updates to avoid potential instability", "Only updating the system once a year to minimize disruptions"], "correct": 1, "explanation": "Using package managers like apt or yum to automate updates and patches is a key recommendation for maintaining system security by protecting against known vulnerabilities.", "image": "slide_images\\l11\\slide_6.png"}, {"question": "Which of the following is a recommended measure for strong authentication and password policy in Linux hardening?", "options": ["Using only single-factor authentication for all users", "Enforcing weak password policies to simplify user access", "Locking user accounts after repeated failed login attempts", "Disabling the use of PAM (pluggable authentication modules)"], "correct": 2, "explanation": "Locking user accounts after repeated failed login attempts is a recommended security measure to prevent brute force attacks. This is typically configured in the /etc/pam.d files.", "image": "slide_images\\l11\\slide_6.png"}, {"question": "Which of the following is a recommended measure for secure remote access in Linux hardening?", "options": ["Enable root login via SSH", "Use password-based authentication", "Use key-based authentication instead of password", "Allow SSH access to all users"], "correct": 2, "explanation": "Using key-based authentication is more secure than password-based authentication as it reduces the risk of brute-force attacks and unauthorized access.", "image": "slide_images\\l11\\slide_7.png"}, {"question": "Which tool is commonly used for log analysis and intrusion detection in Linux hardening?", "options": ["rsyslog", "journald", "fail2ban", "AIDE"], "correct": 2, "explanation": "fail2ban is an intrusion prevention tool that monitors log files and bans IPs that show malicious signs, such as repeated failed login attempts.", "image": "slide_images\\l11\\slide_7.png"}, {"question": "Which of the following is a recommended Linux hardening measure for firewall configuration?", "options": ["Disable all incoming traffic", "Use iptables/nftables/ufw to restrict traffic to trusted sources only", "Allow all outbound traffic without restrictions", "Block only SSH traffic"], "correct": 1, "explanation": "Configuring firewall rules to restrict inbound and outbound traffic to trusted sources is a key Linux hardening measure.", "image": "slide_images\\l11\\slide_8.png"}, {"question": "What is the purpose of using the 'noexec' mount option in Linux file system security?", "options": ["To prevent unauthorized users from executing files", "To disable the creation of SUID files", "To prevent the creation of block device files", "To encrypt sensitive data"], "correct": 1, "explanation": "The 'noexec' mount option prevents the execution of files on a filesystem, enhancing security by limiting unauthorized file execution.", "image": "slide_images\\l11\\slide_8.png"}, {"question": "Which of the following is a benefit of partitioning the Linux file system into separate partitions like /var, /tmp, and /home?", "options": ["It increases the overall storage capacity of the system", "It limits the damage if the system is compromised by isolating different parts of the file system", "It allows for more efficient use of disk space", "It simplifies the process of backing up the entire file system"], "correct": 1, "explanation": "Partitioning helps to contain potential damage from security breaches by isolating critical directories.", "image": "slide_images\\l11\\slide_8.png"}, {"question": "What does the 'nodev' mount option do in Linux?", "options": ["It prevents the creation of block device files", "It disables the SUID bit on files", "It encrypts the file system", "It allows only root users to execute files"], "correct": 0, "explanation": "The 'nodev' mount option stops users from creating fake block device files, preventing potential misuse of device nodes to access system hardware.", "image": "slide_images\\l11\\slide_8.png"}, {"question": "Which of the following is a tool used for system auditing in Linux hardening?", "options": ["auditd", "netstat", "Lynis", "firewall-cmd"], "correct": 2, "explanation": "Lynis is a popular tool used for conducting security audits and assessing system compliance. auditd is for monitoring and logging, netstat shows network connections, and firewall-cmd manages firewall rules.", "image": "slide_images\\l11\\slide_9.png"}, {"question": "What is the primary purpose of disabling unused network services and ports in Linux hardening?", "options": ["To increase system performance", "To reduce the attack surface", "To improve network speed", "To simplify system administration"], "correct": 1, "explanation": "Disabling unused services and ports reduces the number of potential entry points for attackers, thereby minimizing the system's exposure to threats.", "image": "slide_images\\l11\\slide_9.png"}, {"question": "What is the primary purpose of setting the umask value in Linux hardening?", "options": ["To change permissions of existing files", "To set default permissions for newly created files and directories", "To disable IP packet forwarding", "To prevent IP source routing"], "correct": 1, "explanation": "Umask sets the default permissions for newly created files and directories. It does not alter permissions of existing files, which is the role of chmod.", "image": "slide_images\\l11\\slide_10.png"}, {"question": "Which sysctl setting is crucial for preventing a Linux system from acting as a router?", "options": ["net.ipv4.conf.all.accept_source_route = 0", "net.ipv4.ip_forward = 0", "Both A and B", "Neither A nor B"], "correct": 1, "explanation": "Setting net.ipv4.ip_forward = 0 disables IP packet forwarding, which stops the system from acting as a router. While preventing IP source routing (accept_source_route) is also important, it addresses a different security concern.", "image": "slide_images\\l11\\slide_10.png"}, {"question": "What is the role of tools like find and AIDE in Linux hardening?", "options": ["To set default file permissions", "To search for and fix permissions of sensitive files", "To modify kernel parameters", "To disable IP source routing"], "correct": 2, "explanation": "Tools like find and AIDE are used to identify and correct permissions for sensitive files like /etc/passwd and /etc/shadow, enhancing system security.", "image": "slide_images\\l11\\slide_10.png"}, {"question": "Which of the following is a key Linux hardening measure related to enforcing security policies on programs and services?", "options": ["Using TCP Wrappers", "Implementing Antivirus/Anti-Malware tools", "Enforcing AppArmor/SELinux", "Segmenting the network"], "correct": 2, "explanation": "AppArmor/SELinux are security frameworks that enforce security policies and restrict the capabilities of programs and services, limiting their actions to enhance system security.", "image": "slide_images\\l11\\slide_11.png"}, {"question": "What is the purpose of using TCP Wrappers in Linux hardening?", "options": ["To detect rootkits", "To control network access based on IP addresses", "To segment the network", "To enforce security policies on applications"], "correct": 1, "explanation": "TCP Wrappers is a host-based networking access control system that uses /etc/hosts.allow and /etc/hosts.deny files to allow or deny specific IP addresses from accessing the system, thus controlling network access.", "image": "slide_images\\l11\\slide_11.png"}, {"question": "What is the primary purpose of protecting the GRUB boot loader with a password?", "options": ["To prevent unauthorized modification of boot parameters", "To speed up the boot process", "To encrypt the operating system", "To increase the storage capacity"], "correct": 0, "explanation": "Protecting the GRUB boot loader with a password prevents unauthorized users from altering boot parameters, which could compromise system security.", "image": "slide_images\\l11\\slide_12.png"}, {"question": "Which of the following is a host-based Intrusion Detection System (IDS) mentioned in the slide content?", "options": ["AIDE", "OSSEC", "Snort", "Wireshark"], "correct": 1, "explanation": "OSSEC is explicitly mentioned as a host-based IDS (HIDS) for active monitoring and alerting. AIDE is mentioned as an IDS/IPS but not specifically as host-based. Snort and Wireshark are network-based tools.", "image": "slide_images\\l11\\slide_12.png"}, {"question": "What is the primary purpose of regularly backing up critical data in Linux hardening?", "options": ["To prevent data loss due to hardware failure", "To ensure business continuity in case of cyberattacks or data corruption", "To comply with data protection regulations", "To reduce the storage requirements for data"], "correct": 1, "explanation": "Regular backups are crucial for ensuring that critical data can be restored in case of data loss events such as cyberattacks, hardware failure, or accidental deletion. This ensures business continuity and minimizes downtime.", "image": "slide_images\\l11\\slide_13.png"}, {"question": "Which of the following is a recommended practice for securing backups in Linux hardening?", "options": ["Storing backups on the same server as the original data", "Using unencrypted backups for faster recovery", "Encrypting backups and storing them in a separate, secure location", "Performing backups only once a year"], "correct": 2, "explanation": "Encrypting backups protects them from unauthorized access, and storing them in a separate location ensures they are safe from physical or digital threats that might compromise the original data.", "image": "slide_images\\l11\\slide_13.png"}, {"question": "What is the primary function of Firewalld?", "options": ["Monitors file integrity and detects modifications", "Manages firewall rules and blocks unauthorized connections", "Restricts outbound traffic to prevent reverse shells", "Limits open ports and services to reduce attack surface"], "correct": 1, "explanation": "Firewalld's primary function is to manage firewall rules, block unauthorized inbound connections, and control network traffic.", "image": "slide_images\\l11\\slide_15.png"}, {"question": "What does AIDE primarily do?", "options": ["Manages firewall rules", "Monitors file integrity and detects modifications", "Restricts outbound traffic", "Limits open ports and services"], "correct": 1, "explanation": "AIDE (Advanced Intrusion Detection Environment) monitors file integrity, detects modifications to system binaries, and compares file hashes to a trusted baseline.", "image": "slide_images\\l11\\slide_15.png"}, {"question": "Which security mechanism enforces mandatory access control (MAC) to limit process access to files, ports, and services, and prevents privilege escalation?", "options": ["Firewalld", "AIDE", "FA Policy", "SELinux"], "correct": 3, "explanation": "SELinux is designed to enforce mandatory access control, restricting what processes can access and preventing privilege escalation.", "image": "slide_images\\l11\\slide_16.png"}, {"question": "What is the primary function of File Access Policy (FA Policy)?", "options": ["Network protection", "Tamper detection", "Restricting application file execution", "Access restriction and containment"], "correct": 2, "explanation": "FA Policy focuses on restricting which applications can execute which files, preventing unauthorized binaries from running and reducing the risk of malicious binary execution.", "image": "slide_images\\l11\\slide_16.png"}, {"question": "Which security tool is primarily designed to prevent unauthorized binary execution?", "options": ["FA Policy", "SELinux", "AIDE", "Firewalld"], "correct": 0, "explanation": "FA Policy is specifically mentioned as the tool that protects against unauthorized binary execution.", "image": "slide_images\\l11\\slide_17.png"}, {"question": "What is the main purpose of SELinux in the layered protection strategy?", "options": ["To block malicious network communication", "To prevent privilege escalation and system modification", "To detect binary tampering and rootkits", "To stop unknown programs from running"], "correct": 1, "explanation": "SELinux is described as protecting against privilege escalation and system modification, which aligns with its primary function of controlling access to resources and enforcing security policies.", "image": "slide_images\\l11\\slide_17.png"}, {"question": "What is the primary purpose of the firewalld service?", "options": ["To manage network traffic", "To control incoming and outgoing network traffic", "To monitor system performance", "To manage user accounts"], "correct": 1, "explanation": "Firewalld is a software-based security system that controls incoming and outgoing network traffic, making option B the correct answer.", "image": "slide_images\\l11\\slide_20.png"}, {"question": "What is the difference between a normal rule and a rich rule in firewalld?", "options": ["Normal rules are more complex, while rich rules are simpler", "Normal rules are less granular, while rich rules are more complex and offer finer control", "Normal rules are only for GUI configuration, while rich rules are for command line", "Normal rules are for incoming traffic, while rich rules are for outgoing traffic"], "correct": 1, "explanation": "The difference between a normal rule and a rich rule is mainly about complexity and granularity of control, making option B the correct answer.", "image": "slide_images\\l11\\slide_20.png"}, {"question": "What is the primary advantage of using Rich Rules in firewalld compared to basic rules?", "options": ["They allow for more detailed and flexible control", "They are easier to configure", "They only focus on source IP addresses", "They are the default rules in firewalld"], "correct": 0, "explanation": "Rich rules provide more detailed control over firewall settings, including source/destination IP, port, protocol, action, and logging, unlike basic rules which are limited to allowing services or ports.", "image": "slide_images\\l11\\slide_21.png"}, {"question": "Which of the following is NOT a condition that can be defined using Rich Rules in firewalld?", "options": ["Source or destination IP", "Port number", "Protocol (TCP/UDP)", "Logging"], "correct": 3, "explanation": "While Rich Rules allow defining source/destination IP, port number, protocol, and action (accept, drop, reject), logging is not listed as a condition but rather as a separate aspect of the rules.", "image": "slide_images\\l11\\slide_21.png"}, {"question": "What does the 'trusted' zone in firewalld signify?", "options": ["All traffic is allowed", "Only selected services are allowed", "All traffic is silently dropped", "All traffic is rejected with a reply"], "correct": 0, "explanation": "The 'trusted' zone signifies the highest level of trust, where all traffic is allowed without any restrictions.", "image": "slide_images\\l11\\slide_22.png"}, {"question": "Which of the following scenarios requires you to specify a zone in firewalld?", "options": ["When a server has only one network interface", "When you want to apply a rule to a specific network", "When all traffic is allowed", "When the firewall is in its default state"], "correct": 1, "explanation": "You must specify a zone when you want to apply a rule to a specific network, among other scenarios like multiple interfaces or different zones.", "image": "slide_images\\l11\\slide_22.png"}, {"question": "What is the default active zone in firewalld?", "options": ["drop", "public", "trusted", "block"], "correct": 1, "explanation": "The default active zone in firewalld is 'public', which allows only selected services and is considered a medium level of trust.", "image": "slide_images\\l11\\slide_22.png"}, {"question": "What happens to outgoing traffic in firewalld, regardless of the zone?", "options": ["It is always allowed", "It is always blocked", "It is controlled by zone rules", "It is silently dropped"], "correct": 0, "explanation": "Outgoing traffic is allowed in all zones by default, meaning it is not restricted by the zone's rules.", "image": "slide_images\\l11\\slide_22.png"}, {"question": "What is the default status of incoming traffic in the public zone?", "options": ["Allowed", "Blocked", "Allowed only for SSH", "No restrictions"], "correct": 1, "explanation": "In the public zone, incoming traffic is blocked by default for security reasons, while outgoing traffic is allowed.", "image": "slide_images\\l11\\slide_23.png"}, {"question": "Which type of traffic is usually allowed in the public zone to prevent administrative lockout?", "options": ["SSH", "All outgoing traffic", "All incoming traffic", "No traffic"], "correct": 0, "explanation": "SSH (Secure Shell) is typically permitted by default in the public zone to ensure access to the system for management purposes.", "image": "slide_images\\l11\\slide_23.png"}, {"question": "What is the correct command to allow SSH traffic through the firewall?", "options": ["sudo firewall-cmd --permanent --add-port=22/tcp", "sudo firewall-cmd --permanent --add-service=ssh", "sudo firewall-cmd --permanent --add-service=sftp", "sudo firewall-cmd --permanent --add-port=22/udp"], "correct": 1, "explanation": "The correct command uses --add-service=ssh to allow SSH traffic on port 22.", "image": "slide_images\\l11\\slide_24.png"}, {"question": "Which command is used to view all settings for the public zone?", "options": ["sudo firewall-cmd --permanent --zone=public --list-all", "sudo firewall-cmd --permanent --zone=drop --change-interface=eth0", "sudo firewall-cmd --reload", "sudo firewall-cmd --permanent --add-service=http"], "correct": 0, "explanation": "The command --list-all displays all settings for the specified zone, in this case, the public zone.", "image": "slide_images\\l11\\slide_24.png"}, {"question": "Which command is used to allow access to a specific IP address for the SSH service using a rich rule?", "options": ["sudo firewall-cmd --permanent --add-port=8080/tcp", "sudo firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.1.100\" service name=\"ssh\" accept'", "sudo firewall-cmd --permanent --remove-service=http", "sudo firewall-cmd --permanent --add-service=ssh"], "correct": 1, "explanation": "The correct command uses the --add-rich-rule option to specify a rule that allows access from a particular IP address (192.168.1.100) for the SSH service.", "image": "slide_images\\l11\\slide_25.png"}, {"question": "Which command is used to remove the HTTP service from the firewall configuration?", "options": ["sudo firewall-cmd --permanent --add-port=8080/tcp", "sudo firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.1.100\" service name=\"ssh\" accept'", "sudo firewall-cmd --permanent --remove-service=http", "sudo firewall-cmd --permanent --add-service=http"], "correct": 2, "explanation": "The correct command uses the --remove-service option followed by the service name (http) to remove it from the firewall configuration.", "image": "slide_images\\l11\\slide_25.png"}, {"question": "What is the primary purpose of SELinux?", "options": ["To provide user authentication and password management", "To control access to system resources based on security policies", "To encrypt data stored on the disk", "To monitor network traffic for malicious activity"], "correct": 1, "explanation": "SELinux's main function is to enforce security policies using Mandatory Access Control (MAC), restricting access to files, processes, and network resources.", "image": "slide_images\\l11\\slide_27.png"}, {"question": "What does the SELinux label 'system_u:object_r:sshd_exec_t:s0' indicate?", "options": ["A user with the role 'object_r' executing the sshd program", "A process with the user 'system_u' requesting access to the sshd executable", "A file or process with the type 'sshd_exec_t' and level 's0'", "A network resource with the type 'sshd_exec_t' and level 's0'"], "correct": 3, "explanation": "SELinux labels follow the format [User:role:type:level]. In this case, 'system_u:object_r:sshd_exec_t:s0' represents a file or process type 'sshd_exec_t' with security level 's0'.", "image": "slide_images\\l11\\slide_27.png"}, {"question": "What is the primary purpose of labeling in SELinux?", "options": ["To encrypt system files", "To uniquely identify files and processes for access control", "To define rules for process access", "To monitor system performance"], "correct": 1, "explanation": "Labeling in SELinux is used to uniquely identify files and processes, enabling SELinux to track and apply access control policies effectively.", "image": "slide_images\\l11\\slide_28.png"}, {"question": "What does SELinux use to determine if a process can access a file?", "options": ["User permissions", "File size", "Type enforcement rules", "File ownership"], "correct": 2, "explanation": "SELinux uses type enforcement rules, which define allowed or denied access based on the 'type' field in the labels of processes and files.", "image": "slide_images\\l11\\slide_28.png"}, {"question": "What does SELinux do when a process tries to access a resource it is not allowed to access?", "options": ["Allows the access and logs a warning", "Blocks the access and shows 'Permission denied'", "Allows the access and ignores the policy", "Does not check the access"], "correct": 1, "explanation": "SELinux enforces access control strictly. If a process attempts an action that violates the policy (e.g., reading a file it shouldn't), SELinux immediately blocks the operation, displays 'Permission denied', and logs the event in the audit log.", "image": "slide_images\\l11\\slide_29.png"}, {"question": "Which of the following is true about SELinux's handling of security contexts?", "options": ["Only files have security contexts", "Security contexts are assigned only to processes and users", "SELinux assigns security contexts to files, processes, users, and ports", "Security contexts are optional for network ports"], "correct": 2, "explanation": "SELinux uses security contexts to label and manage access control for various system components. These contexts are assigned to files, processes, users, and ports to define allowed interactions according to the SELinux policy.", "image": "slide_images\\l11\\slide_29.png"}, {"question": "What is the most important field in SELinux labels for policy enforcement?", "options": ["User", "Role", "Type", "Level"], "correct": 2, "explanation": "The 'Type' field is the most important for SELinux policy enforcement as it dictates what an object or process is allowed to access.", "image": "slide_images\\l11\\slide_30.png"}, {"question": "Which SELinux label component is used for Multi-Level Security (MLS/MCS)?", "options": ["User", "Role", "Type", "Level"], "correct": 3, "explanation": "The 'Level' field is used for Multi-Level Security, defining the sensitivity level of the object or process.", "image": "slide_images\\l11\\slide_30.png"}, {"question": "What does the 'object_r' role in SELinux typically represent?", "options": ["System processes", "Files", "SELinux user identity", "Binary files"], "correct": 1, "explanation": "'object_r' is a role assigned to files in SELinux, used in Role-Based Access Control (RBAC).", "image": "slide_images\\l11\\slide_30.png"}, {"question": "What does the SELinux level 's0:c0,c1' represent?", "options": ["Sensitivity level 0 with category 0 only", "Sensitivity level 0 with categories 0 and 1", "Sensitivity level 1 with categories 0 and 1", "Sensitivity level 0 with no categories"], "correct": 1, "explanation": "The 's0:c0,c1' indicates sensitivity level 0 with both category 0 and category 1, used for stricter isolation between departments.", "image": "slide_images\\l11\\slide_31.png"}, {"question": "Which SELinux level represents the default security level in most Linux systems with no categories assigned?", "options": ["s0:c0", "s0:c1", "s0", "s0:c0,c1"], "correct": 2, "explanation": "The 's0' represents sensitivity level 0 with no categories assigned and is the default level in most Linux systems.", "image": "slide_images\\l11\\slide_31.png"}, {"question": "Which command is used for a temporary change of SELinux mode?", "options": ["setenforce 0", "vi /etc/selinux/config", "getenforce", "reboot"], "correct": 0, "explanation": "The 'setenforce' command is used for temporary changes to the SELinux mode. Changes made using 'vi /etc/selinux/config' are permanent and require a reboot.", "image": "slide_images\\l11\\slide_32.png"}, {"question": "What is the SELinux mode set to when you configure SELINUX=permissive in the /etc/selinux/config file?", "options": ["Enforcing", "Permissive", "Disabled", "Temporary"], "correct": 1, "explanation": "Configuring SELINUX=permissive in the /etc/selinux/config file sets SELinux to Permissive mode after a reboot. In this mode, SELinux will log policy violations but not enforce them.", "image": "slide_images\\l11\\slide_32.png"}, {"question": "Which command is used to check the SELinux status on a system?", "options": ["ls -lz", "ps axZ", "sestatus", "netstat -taz"], "correct": 2, "explanation": "The 'sestatus' command displays the current SELinux status, including whether it is enabled or disabled, the policy being used, and the current mode (enforcing or permissive).", "image": "slide_images\\l11\\slide_33.png"}, {"question": "What does the 'Current mode: enforcing' in the output of 'sestatus' indicate?", "options": ["SELinux is disabled", "SELinux is in permissive mode, logging actions but not enforcing them", "SELinux is actively enforcing security policies", "SELinux is in a disabled state"], "correct": 2, "explanation": "When 'Current mode: enforcing' is displayed, it means that SELinux is actively enforcing its security policies and preventing unauthorized actions based on the loaded policy.", "image": "slide_images\\l11\\slide_33.png"}, {"question": "What is the purpose of a Boolean setting in SELinux?", "options": ["To modify the entire SELinux policy", "To check the status of SELinux", "To turn specific SELinux permissions ON or OFF without modifying the entire policy", "To display all active SELinux booleans"], "correct": 2, "explanation": "Boolean settings allow for granular control over specific SELinux permissions without requiring changes to the overall SELinux policy.", "image": "slide_images\\l11\\slide_34.png"}, {"question": "Which command is used to permanently set a Boolean value in SELinux?", "options": ["getsebool", "semanage boolean -l", "setsebool -P", "httpd_can_network_connect"], "correct": 2, "explanation": "The 'setsebool -P' command is used to permanently change the value of a Boolean setting in SELinux. The '-P' flag ensures the change is persistent across reboots.", "image": "slide_images\\l11\\slide_34.png"}, {"question": "What is the primary characteristic of a confined user in SELinux?", "options": ["Full system access with minimal restrictions", "Restricted access to files, processes, and commands based on SELinux policies", "No access to sensitive system areas even with permission", "Similar to traditional Linux root/user permissions"], "correct": 1, "explanation": "A confined user is restricted by SELinux policies, limiting their access to files, processes, and commands as defined by the policy.", "image": "slide_images\\l11\\slide_35.png"}, {"question": "Which of the following is an example of a confined user in SELinux?", "options": ["unconfined_u", "user_u", "staff_u", "guest_u"], "correct": 1, "explanation": "user_u is listed as an example of a confined user in the provided SELinux context. unconfined_u is an example of an unconfined user.", "image": "slide_images\\l11\\slide_35.png"}, {"question": "Why was the Apache user initially denied access to the file /var/www/html/help.txt?", "options": ["The file had incorrect file permissions (read/write) for the Apache user", "The file was labeled with the wrong SELinux context (unconfined_u:object_r:default_t)", "The file was owned by a different user", "The file did not exist in the specified directory"], "correct": 1, "explanation": "The 'ls -ldZ' output showed the file had the context 'unconfined_u:object_r:default_t', which is not appropriate for web content. SELinux denied access because the correct context for web content served by Apache is 'httpd_sys_content_t'.", "image": "slide_images\\l11\\slide_36.png"}, {"question": "What command was used to correct the SELinux context of the file /var/www/html/help.txt?", "options": ["chmod", "chown", "restorecon", "semanage"], "correct": 2, "explanation": "The 'restorecon -v /var/www/html/help.txt' command was used to restore the correct SELinux context. 'restorecon' is the SELinux utility for restoring default file context based on the file's path.", "image": "slide_images\\l11\\slide_36.png"}, {"question": "What is the purpose of the 'setsebool -P ftp_home_dir on' command in the context of FTP permissions?", "options": ["To allow FTP users to access their home directories", "To enable read-only access to public directories", "To grant write access to all FTP directories", "To disable SELinux protection for FTP"], "correct": 0, "explanation": "The 'setsebool -P ftp_home_dir on' command enables the FTP home directory access boolean in SELinux, allowing FTP users to access their home directories. Without this, login may work, but directory access will fail due to SELinux restrictions.", "image": "slide_images\\l11\\slide_37.png"}, {"question": "Which SELinux file context type should be applied to the /data/ftp directory to allow both read and write access for FTP users?", "options": ["public_content_t", "public_content_rw_t", "ftp_home_dir_t", "default_t"], "correct": 1, "explanation": "The 'public_content_rw_t' SELinux file context type allows FTP users to have both read and write access to the specified directory. The 'semanage fcontext' command is used to set this context, and 'restorecon' applies the changes. 'public_content_t' provides read-only access, and 'ftp_home_dir_t' is for user home directories.", "image": "slide_images\\l11\\slide_37.png"}, {"question": "What is the primary function of AIDE?", "options": ["To prevent unauthorized changes to files", "To detect unauthorized changes to files by comparing them to a baseline", "To encrypt files for security", "To actively block malicious processes"], "correct": 1, "explanation": "AIDE is a passive monitoring tool that detects changes by comparing the current file state to a baseline database, it does not actively prevent changes.", "image": "slide_images\\l11\\slide_38.png"}, {"question": "What happens when AIDE detects a change in a file's state?", "options": ["It automatically restores the file to its original state", "It generates a report for investigation", "It alerts the user in real-time and blocks further access", "It deletes the modified file"], "correct": 1, "explanation": "AIDE generates a report when it detects a discrepancy, allowing administrators to investigate potential unauthorized changes. It does not actively intervene or restore files.", "image": "slide_images\\l11\\slide_38.png"}, {"question": "What is a key limitation of AIDE?", "options": ["It requires root access to function", "It can only monitor specific file types", "It is a passive tool with no active prevention capabilities", "It consumes excessive system resources"], "correct": 2, "explanation": "AIDE is explicitly described as a passive tool that reports changes but does not actively prevent them, making this its key limitation in terms of security response.", "image": "slide_images\\l11\\slide_38.png"}, {"question": "Which command is used to initialize the AIDE database and create a snapshot?", "options": ["aide -init", "aide -check", "mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db", "aide -update"], "correct": 0, "explanation": "The 'aide -init' command initializes the AIDE database and creates a snapshot, which is then saved to /var/lib/aide/aide.db.new.", "image": "slide_images\\l11\\slide_39.png"}, {"question": "Which attribute in the AIDE configuration monitors changes to file permissions?", "options": ["p", "I", "n", "u"], "correct": 0, "explanation": "The 'p' attribute monitors changes in file permissions (chmod).", "image": "slide_images\\l11\\slide_39.png"}, {"question": "Which attribute in the AIDE configuration monitors changes to the MD5 hash of a file?", "options": ["m", "s", "b", "c"], "correct": 0, "explanation": "The 'm' attribute monitors changes to the MD5 hash (or other hash types like SHA256 or SHA1) of a file.", "image": "slide_images\\l11\\slide_39.png"}, {"question": "Which AIDE predefined rule group includes the attributes p+u+g+s+m+c+md5?", "options": ["R", "L", "FIPSR", "NORMAL"], "correct": 0, "explanation": "The slide content explicitly states that the 'R' group includes the attributes p+u+g+s+m+c+md5.", "image": "slide_images\\l11\\slide_40.png"}, {"question": "What is the recommended AIDE setting for strong protection in a production environment?", "options": ["p+u+g", "p+u+g+s+m+c+sha256", "p+u+g+s+m", "p+u+g+c"], "correct": 1, "explanation": "The slide content specifies that the best practice in production is to use p+u+g+s+m+c+i+sha256, but the closest option provided is p+u+g+s+m+c+sha256, which is the core of the recommendation.", "image": "slide_images\\l11\\slide_40.png"}, {"question": "What is the primary purpose of FA Policy (File Access Policy Daemon)?", "options": ["To encrypt files for secure storage", "To allow only trusted and approved files to run and block untrusted or unknown executables", "To compress files to save disk space", "To schedule and automate file backups"], "correct": 1, "explanation": "FA Policy is designed to enhance security by restricting the execution of untrusted or unapproved files, thereby preventing potential threats like malware and unauthorized scripts.", "image": "slide_images\\l11\\slide_42.png"}, {"question": "Where are the FA Policy rules files typically located?", "options": ["/etc/fapolicyd/rules.d/", "/etc/fapolicyd/policies/", "/etc/fapolicyd/conf.d/", "/etc/fapolicyd/allowlist.d/"], "correct": 0, "explanation": "The rules files for FA Policy are stored in the /etc/fapolicyd/rules.d/ directory, as indicated in the slide content.", "image": "slide_images\\l11\\slide_42.png"}, {"question": "Which FAPolicyd rule allows execution of trusted RPM files?", "options": ["allow perm=execute all : trust=1", "deny perm=execute all : dir=/tmp", "allow perm=execute uid=0 : trust=1", "deny perm=execute all : trust=1"], "correct": 0, "explanation": "The rule 'allow perm=execute all : trust=1' allows execution of files with trust level 1, which corresponds to trusted RPM files.", "image": "slide_images\\l11\\slide_43.png"}, {"question": "Which FAPolicyd rule blocks malware execution from the /tmp directory?", "options": ["allow perm=execute all : trust=1", "deny perm=execute all : dir=/tmp", "allow perm=execute uid=0 : trust=1", "deny perm=execute all : trust=1"], "correct": 1, "explanation": "The rule 'deny perm=execute all : dir=/tmp' explicitly blocks the execution of any files located in the /tmp directory, preventing potential malware execution.", "image": "slide_images\\l11\\slide_43.png"}, {"question": "How can you check the trust level of the file '/usr/bin/ls' using fapolicyd-cli?", "options": ["fapolicyd-cli --check-trust /usr/bin/ls", "fapolicyd-cli --verify /usr/bin/ls", "fapolicyd-cli --trust 1 /usr/bin/ls", "fapolicyd-cli --scan /usr/bin/ls"], "correct": 0, "explanation": "The correct command to check the trust level of a file is 'fapolicyd-cli --check-trust' followed by the file path.", "image": "slide_images\\l11\\slide_44.png"}, {"question": "Which of the following policies is designed to prevent malware execution from the '/tmp' directory?", "options": ["deny perm=execute all:dir=/tmp", "allow perm=execute uid=0:trust=1", "trust=1 for all files in /tmp", "block all:dir=/tmp"], "correct": 0, "explanation": "The policy 'deny perm=execute all:dir=/tmp' specifically blocks the execution of files from the '/tmp' directory, helping to prevent malware execution.", "image": "slide_images\\l11\\slide_44.png"}, {"question": "What is the purpose of FAPolicyd?", "options": ["To monitor network traffic", "To control which applications can be executed on the system", "To manage user permissions and access rights", "To encrypt files and directories"], "correct": 1, "explanation": "FAPolicyd is an application allowlisting daemon that restricts the execution of applications and libraries to only those that are known and trusted.", "image": "slide_images\\l11\\slide_45.png"}, {"question": "What happens when permissive mode is set to 0 in FAPolicyd?", "options": ["All applications are allowed to run", "Only signed applications are allowed to run", "Execution of unknown applications is blocked", "The system becomes more secure"], "correct": 2, "explanation": "When permissive mode is set to 0, FAPolicyd enforces the allowlisting policy and blocks the execution of applications that are not explicitly allowed, as demonstrated by the error message when trying to run /tmp/ls.", "image": "slide_images\\l11\\slide_45.png"}, {"question": "Which command is used to load the FAPolicy rules after making changes to the rules file?", "options": ["fapolicyd -load", "fagenrules --load", "fapolicy -load", "fagen -load"], "correct": 1, "explanation": "The correct command to load FAPolicy rules is 'fagenrules \u2013load' as indicated in the slide content.", "image": "slide_images\\l11\\slide_46.png"}, {"question": "What is the purpose of specifying 'sha256hash' in a FAPolicy rule?", "options": ["To allow execution of a specific binary based on its SHA256 hash", "To prevent changes to a binary", "To grant full trust to the binary", "To deny execution of the binary"], "correct": 1, "explanation": "Specifying 'sha256hash' in a rule allows the system to identify and apply the rule based on the binary's unique SHA256 hash, which helps in preventing unauthorized modifications to the binary as mentioned in the slide.", "image": "slide_images\\l11\\slide_46.png"}, {"question": "Which command is used to check the status of the fapolicyd service?", "options": ["systemctl start fapolicyd", "systemctl status fapolicyd", "journalctl -u fapolicyd", "fapolicyd-cli --list"], "correct": 1, "explanation": "The correct command to check the status of the fapolicyd service is 'systemctl status fapolicyd'.", "image": "slide_images\\l11\\slide_47.png"}, {"question": "Which command is used to view the logs for fapolicyd?", "options": ["systemctl start fapolicyd", "systemctl status fapolicyd", "journalctl -u fapolicyd", "fapolicyd-cli --list"], "correct": 2, "explanation": "The correct command to view the logs for fapolicyd is 'journalctl -u fapolicyd'.", "image": "slide_images\\l11\\slide_47.png"}];
    let currentIdx = 0;
    let correctCount = 0;
    let answeredCount = 0;

    const qText = document.getElementById('q-text');
    const qImg = document.getElementById('q-img');
    const optionsContainer = document.getElementById('options-container');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const ticker = document.getElementById('ticker');
    const explanation = document.getElementById('explanation');

    function loadQuestion() {
        const q = quizData[currentIdx];
        qText.innerText = q.question;
        
        if(q.image) {
            qImg.src = q.image;
            qImg.classList.remove('hidden');
        } else {
            qImg.classList.add('hidden');
        }

        optionsContainer.innerHTML = '';
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(i);
            optionsContainer.appendChild(btn);
        });

        explanation.classList.add('hidden');
        submitBtn.disabled = true;
        nextBtn.disabled = true;
        updateTicker();
    }

    let selectedIdx = null;
    function selectOption(idx) {
        if (nextBtn.disabled === false) return; // Lock after submit
        selectedIdx = idx;
        submitBtn.disabled = false;
        
        // Visual feedback for selection
        Array.from(optionsContainer.children).forEach((btn, i) => {
            btn.style.background = (i === idx) ? '#e9ecef' : 'white';
        });
    }

    submitBtn.onclick = () => {
        const q = quizData[currentIdx];
        const buttons = optionsContainer.children;
        
        // Requirement 5: Highlight correct in green
        buttons[q.correct].classList.add('correct');
        
        if (selectedIdx === q.correct) {
            correctCount++;
        }
        
        answeredCount++;
        explanation.innerText = "Explanation: " + q.explanation;
        explanation.classList.remove('hidden');
        
        submitBtn.disabled = true;
        nextBtn.disabled = false;
        
        if (currentIdx === quizData.length - 1) {
            nextBtn.innerText = "Done";
        }
        updateTicker();
    };

    nextBtn.onclick = () => {
        if (currentIdx < quizData.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            showFinal();
        }
    };

    function updateTicker() {
        ticker.innerText = `Correct: ${correctCount} / Answered: ${answeredCount} / Total: ${quizData.length}`;
    }

    function showFinal() {
        document.getElementById('quiz-container').classList.add('hidden');
        const final = document.getElementById('final-screen');
        final.classList.remove('hidden');
        document.getElementById('final-score').innerText = `Your Score: ${correctCount} / ${quizData.length}`;
    }

    loadQuestion();
</script>
